# ==============================================================================
# GML AI Business Assistant v2.0 — Database Catalog & RBAC Matrix
# Specification: Spec §11.9, Plan §Task 1
# Schema: ai_views
# ==============================================================================

version: "2.0"
schema: "ai_views"

views:
  ai_v_no_vay:
    description: "View tổng hợp toàn diện về nợ vay, hạn mức tín dụng và tài sản bảo đảm của doanh nghiệp."
    grain: "Một dòng cho mỗi hợp đồng vay, hạn mức, tài sản bảo đảm hoặc số dư tài khoản vay tại kỳ báo cáo."
    allowed_roles:
      - "ceo"
      - "ke_toan_truong"
    source_tables:
      - "silver.fact_creditlimitsummary"
      - "silver.fact_collateral"
      - "silver.fact_loan"
      - "silver.fact_cashflow"
    columns:
      - name: "bank_name"
        type: "TEXT"
        description: "Tên ngân hàng hoặc tổ chức tín dụng"
        unit: ""
      - name: "record_type"
        type: "TEXT"
        description: "Phân loại bản ghi: credit_limit, collateral, loan_contract, ledger_balance"
        unit: ""
      - name: "contract_number"
        type: "TEXT"
        description: "Số hợp đồng tín dụng hoặc số khế ước nhận nợ"
        unit: ""
      - name: "granted_limit"
        type: "NUMERIC"
        description: "Hạn mức tín dụng được cấp bởi ngân hàng"
        unit: "VND"
      - name: "approved_limit"
        type: "NUMERIC"
        description: "Hạn mức tín dụng được phê duyệt"
        unit: "VND"
      - name: "principal_balance"
        type: "NUMERIC"
        description: "Dư nợ gốc thực tế tại ngày chốt số liệu"
        unit: "VND"
      - name: "collateral_value"
        type: "NUMERIC"
        description: "Giá trị định giá tài sản bảo đảm"
        unit: "VND"
      - name: "loan_type"
        type: "TEXT"
        description: "Phân loại khoản vay: ngắn hạn hoặc dài hạn"
        unit: ""
      - name: "interest_rate"
        type: "NUMERIC"
        description: "Lãi suất vay hiện hành (%/năm)"
        unit: "%"
      - name: "start_date"
        type: "DATE"
        description: "Ngày bắt đầu khoản vay hoặc cấp hạn mức"
        unit: ""
      - name: "maturity_date"
        type: "DATE"
        description: "Ngày đáo hạn hợp đồng"
        unit: ""
      - name: "as_of_date"
        type: "DATE"
        description: "Ngày chốt số liệu báo cáo"
        unit: ""

  ai_v_dong_tien:
    description: "View dòng tiền chi tiết từ sổ cái kế toán, phân loại dòng tiền thực tế vào/ra doanh nghiệp."
    grain: "Một dòng cho mỗi bút toán phát sinh dòng tiền."
    allowed_roles:
      - "ceo"
      - "ke_toan_truong"
    source_tables:
      - "silver.fact_cashflow"
      - "silver.dim_account"
      - "silver.dim_accountnumber"
    columns:
      - name: "transaction_id"
        type: "TEXT"
        description: "Mã bút toán hoặc số chứng từ kế toán"
        unit: ""
      - name: "posting_date"
        type: "DATE"
        description: "Ngày hạch toán ghi sổ kế toán"
        unit: ""
      - name: "account_code"
        type: "TEXT"
        description: "Tài khoản kế toán phát sinh (111, 112, ...)"
        unit: ""
      - name: "contra_account_code"
        type: "TEXT"
        description: "Tài khoản đối ứng trong bút toán kép"
        unit: ""
      - name: "bank_account_number"
        type: "TEXT"
        description: "Số tài khoản ngân hàng liên quan đến giao dịch"
        unit: ""
      - name: "cashflow_type"
        type: "TEXT"
        description: "Phân loại dòng tiền (thu, chi, chuyển nội bộ)"
        unit: ""
      - name: "amount"
        type: "NUMERIC"
        description: "Số tiền phát sinh trong giao dịch"
        unit: "VND"
      - name: "is_external_cashflow"
        type: "BOOLEAN"
        description: "Cờ lọc dòng tiền thực tế ra/vào (loại trừ chuyển tiền nội bộ)"
        unit: ""
      - name: "description"
        type: "TEXT"
        description: "Diễn giải chi tiết nội dung bút toán"
        unit: ""

  ai_v_bctc:
    description: "View Báo cáo tài chính chuẩn hoá gồm Bảng cân đối kế toán (B01-DN) và Báo cáo KQKD (B02-DN)."
    grain: "Một dòng cho mỗi chỉ tiêu báo cáo tài chính theo kỳ báo cáo."
    allowed_roles:
      - "ceo"
      - "ke_toan_truong"
    source_tables:
      - "silver.fact_balancesheet"
      - "silver.fact_incomestatement"
      - "silver.dim_reportitem"
    columns:
      - name: "report_type"
        type: "TEXT"
        description: "Mã biểu mẫu báo cáo (B01-DN hoặc B02-DN)"
        unit: ""
      - name: "item_code"
        type: "TEXT"
        description: "Mã số chỉ tiêu trên báo cáo tài chính (ví dụ: 110, 120, 300)"
        unit: ""
      - name: "item_name"
        type: "TEXT"
        description: "Tên chỉ tiêu báo cáo tài chính"
        unit: ""
      - name: "period"
        type: "TEXT"
        description: "Kỳ báo cáo tài chính (tháng, quý, năm)"
        unit: ""
      - name: "closing_balance"
        type: "NUMERIC"
        description: "Số dư cuối kỳ hoặc số phát sinh lũy kế kỳ này"
        unit: "VND"
      - name: "opening_balance"
        type: "NUMERIC"
        description: "Số dư đầu kỳ hoặc số phát sinh cùng kỳ năm trước"
        unit: "VND"
      - name: "as_of_date"
        type: "DATE"
        description: "Ngày chốt số liệu báo cáo"
        unit: ""

  ai_v_ton_kho:
    description: "View dữ liệu tồn kho, nhập kho và xuất kho tổng hợp theo từng kho hàng và mã vật tư sản phẩm."
    grain: "Một dòng cho mỗi bản ghi số dư tồn hoặc giao dịch nhập/xuất theo kho và sản phẩm."
    allowed_roles:
      - "ceo"
      - "quan_ly_kho"
    source_tables:
      - "silver.fact_inventory_balance"
      - "silver.fact_inventoryinward"
      - "silver.fact_inventoryoutward"
      - "silver.dim_product"
      - "silver.dim_warehouse"
    columns:
      - name: "record_type"
        type: "TEXT"
        description: "Loại bản ghi tồn kho: balance (số dư tồn), inward (nhập), outward (xuất)"
        unit: ""
      - name: "warehouse_code"
        type: "TEXT"
        description: "Mã kho hàng"
        unit: ""
      - name: "warehouse_name"
        type: "TEXT"
        description: "Tên kho hàng lưu trữ"
        unit: ""
      - name: "product_code"
        type: "TEXT"
        description: "Mã sản phẩm hoặc vật tư hàng hoá"
        unit: ""
      - name: "product_name"
        type: "TEXT"
        description: "Tên sản phẩm hoặc quy cách gỗ"
        unit: ""
      - name: "unit"
        type: "TEXT"
        description: "Đơn vị tính (tấm, m3, kiện, kg)"
        unit: ""
      - name: "quantity"
        type: "NUMERIC"
        description: "Số lượng tồn, nhập hoặc xuất"
        unit: ""
      - name: "unit_price"
        type: "NUMERIC"
        description: "Đơn giá bình quân hoặc đơn giá giao dịch"
        unit: "VND"
      - name: "total_value"
        type: "NUMERIC"
        description: "Tổng giá trị tồn kho hoặc giá trị nhập/xuất"
        unit: "VND"
      - name: "tx_date"
        type: "DATE"
        description: "Ngày giao dịch hoặc ngày chốt số dư tồn kho"
        unit: ""

  ai_v_cong_no:
    description: "View công nợ đối tác gồm công nợ phải thu khách hàng (AR) và phải trả người bán (AP)."
    grain: "Một dòng cho mỗi chứng từ công nợ phát sinh theo đối tác và hạn thanh toán."
    allowed_roles:
      - "ceo"
      - "ke_toan_truong"
    source_tables:
      - "silver.fact_accountsreceivable"
      - "silver.fact_accountspayable"
      - "silver.dim_partner"
    columns:
      - name: "ar_ap_type"
        type: "TEXT"
        description: "Phân loại công nợ: AR (phải thu khách hàng) hoặc AP (phải trả nhà cung cấp)"
        unit: ""
      - name: "partner_code"
        type: "TEXT"
        description: "Mã khách hàng hoặc nhà cung cấp"
        unit: ""
      - name: "partner_name"
        type: "TEXT"
        description: "Tên đầy đủ của khách hàng hoặc đối tác"
        unit: ""
      - name: "contract_number"
        type: "TEXT"
        description: "Số hợp đồng kinh tế liên quan"
        unit: ""
      - name: "invoice_number"
        type: "TEXT"
        description: "Số hoá đơn GTGT tài chính"
        unit: ""
      - name: "posting_date"
        type: "DATE"
        description: "Ngày ghi nhận công nợ"
        unit: ""
      - name: "due_date"
        type: "DATE"
        description: "Hạn thanh toán theo hợp đồng hoặc chính sách tín dụng"
        unit: ""
      - name: "original_amount"
        type: "NUMERIC"
        description: "Giá trị công nợ ban đầu trên hoá đơn"
        unit: "VND"
      - name: "remaining_amount"
        type: "NUMERIC"
        description: "Số dư công nợ còn phải thu hoặc phải trả"
        unit: "VND"
      - name: "overdue_days"
        type: "INTEGER"
        description: "Số ngày quá hạn thanh toán tính đến ngày chốt số liệu"
        unit: "ngày"
      - name: "is_latest_partner_tx"
        type: "BOOLEAN"
        description: "Cờ xác định giao dịch gần nhất của đối tác đó"
        unit: ""

  ai_v_tien_gui:
    description: "View chi tiết các hợp đồng tiền gửi có kỳ hạn tại các ngân hàng thương mại."
    grain: "Một dòng cho mỗi hợp đồng tiền gửi có kỳ hạn."
    allowed_roles:
      - "ceo"
      - "ke_toan_truong"
    source_tables:
      - "silver.fact_termdeposit"
    columns:
      - name: "contract_id"
        type: "TEXT"
        description: "Mã hợp đồng hoặc số sổ tiền gửi ngân hàng"
        unit: ""
      - name: "bank_name"
        type: "TEXT"
        description: "Tên ngân hàng mở hợp đồng tiền gửi"
        unit: ""
      - name: "deposit_amount"
        type: "NUMERIC"
        description: "Số tiền gốc gửi có kỳ hạn"
        unit: "VND"
      - name: "interest_rate"
        type: "NUMERIC"
        description: "Lãi suất tiền gửi thỏa thuận (%/năm)"
        unit: "%"
      - name: "deposit_date"
        type: "DATE"
        description: "Ngày bắt đầu gửi tiền"
        unit: ""
      - name: "settlement_date"
        type: "DATE"
        description: "Ngày đến hạn tất toán hợp đồng tiền gửi"
        unit: ""
      - name: "term_months"
        type: "INTEGER"
        description: "Kỳ hạn gửi tính theo tháng"
        unit: "tháng"
      - name: "is_active_at_cutoff"
        type: "BOOLEAN"
        description: "Cờ xác định hợp đồng tiền gửi còn hiệu lực tại ngày chốt số liệu"
        unit: ""

  ai_v_ke_hoach:
    description: "View kế hoạch kinh doanh và chỉ tiêu ngân sách hoạt động theo phòng ban và thời gian."
    grain: "Một dòng cho mỗi chỉ tiêu kế hoạch kinh doanh theo kỳ và bộ phận."
    allowed_roles:
      - "ceo"
      - "ke_toan_truong"
    source_tables:
      - "silver.fact_businessplan"
      - "silver.dim_reportitem"
    columns:
      - name: "plan_code"
        type: "TEXT"
        description: "Mã định danh bản kế hoạch kinh doanh"
        unit: ""
      - name: "department"
        type: "TEXT"
        description: "Phòng ban hoặc bộ phận phụ trách thực hiện"
        unit: ""
      - name: "item_code"
        type: "TEXT"
        description: "Mã chỉ tiêu kế hoạch"
        unit: ""
      - name: "item_name"
        type: "TEXT"
        description: "Tên chỉ tiêu kế hoạch hoặc ngân sách"
        unit: ""
      - name: "period"
        type: "TEXT"
        description: "Kỳ kế hoạch (tháng, quý, năm)"
        unit: ""
      - name: "target_value"
        type: "NUMERIC"
        description: "Giá trị mục tiêu kế hoạch đặt ra"
        unit: "VND"
      - name: "actual_value"
        type: "NUMERIC"
        description: "Giá trị thực hiện thực tế lũy kế"
        unit: "VND"
      - name: "completion_rate"
        type: "NUMERIC"
        description: "Tỷ lệ hoàn thành kế hoạch (% thực hiện so với mục tiêu)"
        unit: "%"
