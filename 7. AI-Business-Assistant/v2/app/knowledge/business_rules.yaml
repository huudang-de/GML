    actions:
      - "Theo dõi sát sao tỷ lệ đòn bẩy D/E theo từng tháng trong báo cáo tài chính."
      - "Kiểm soát tốc độ tăng trưởng nợ phải trả thương mại và nợ vay ngân hàng."
    authority_role: "ke_toan_truong"
