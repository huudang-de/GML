ty_le_su_dung_han_muc:
  canh_bao:
    actions:
      - "Tạm dừng giải ngân mới từ các ngân hàng có tỷ lệ sử dụng trên 80%."
      - "Rà soát tiến độ thu hồi công nợ để ưu tiên trả bớt nợ gốc ngắn hạn."
      - "Lập tờ trình gửi Kế toán trưởng rà soát hạn mức tín dụng dự phòng."
    authority_role: "ke_toan_truong"
    disclaimer: "Gợi ý tham khảo từ quy tắc nghiệp vụ, cần người có thẩm quyền quyết định"
  nghiem_trong:
    actions:
      - "Kích hoạt phương án khẩn cấp: ngừng toàn bộ các khoản giải ngân mới chưa cấp thiết."
      - "Báo cáo ngay Tổng Giám Đốc (CEO) để xin phê duyệt phương án tái cấu trúc hạn mức hoặc đàm phán cấp thêm hạn mức tín dụng."
      - "Thu hồi khẩn cấp các khoản phải thu quá hạn để thanh toán ngay nợ vay ngắn hạn đến hạn."
    authority_role: "ceo"
    disclaimer: "Gợi ý tham khảo từ quy tắc nghiệp vụ, cần người có thẩm quyền quyết định"

ltv_ratio:
  canh_bao:
    actions:
      - "Đánh giá lại danh mục tài sản bảo đảm đang thế chấp tại các ngân hàng tài trợ."
      - "Chuẩn bị hồ sơ bổ sung tài sản bảo đảm (quyền sử dụng đất/nhà xưởng/kho bãi) nếu ngân hàng yêu cầu định giá lại."
    authority_role: "ke_toan_truong"
    disclaimer: "Gợi ý tham khảo từ quy tắc nghiệp vụ, cần người có thẩm quyền quyết định"
  nghiem_trong:
    actions:
      - "Lập tức báo cáo CEO và HĐQT về nguy cơ bị ngân hàng phong tỏa hạn mức giải ngân do vi phạm cam kết LTV."
      - "Làm việc với tổ chức thẩm định giá độc lập để đánh giá lại giá trị thị trường tài sản bảo đảm."
      - "Thương lượng chuyển bớt dư nợ sang ngân hàng có dư địa LTV thấp hơn."
    authority_role: "ceo"
    disclaimer: "Gợi ý tham khảo từ quy tắc nghiệp vụ, cần người có thẩm quyền quyết định"

