      - "Cảnh báo rủi ro an toàn tài chính mức cao tới Tổng Giám Đốc và Ban Kiểm soát."
      - "Thắt chặt chính sách mua hàng trả chậm, tăng cường thanh toán dứt điểm công nợ tồn đọng."
      - "Lập kế hoạch tái cơ cấu nguồn vốn, cân nhắc bổ sung vốn chủ sở hữu."
    authority_role: "ceo"
    disclaimer: "Gợi ý tham khảo từ quy tắc nghiệp vụ, cần người có thẩm quyền quyết định"

