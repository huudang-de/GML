version: '3.8'

services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./chroma_db:/chroma_db

  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      - api
